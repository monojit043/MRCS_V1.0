<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>MRCS — Initiate Internal Review</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/internal.css" />
    <style>
        .hero { padding: 32px 28px; }

        /* ── review list table ── */
        .int-review-list {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .int-review-list th {
            background: var(--col-surface-alt);
            color: var(--col-muted);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 10px 14px;
            border-bottom: 1px solid var(--col-border);
            text-align: left;
        }
        .int-review-list td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--col-border);
            color: var(--col-text);
        }
        .int-review-list tr:last-child td { border-bottom: none; }
        .int-review-list tr:hover td { background: #f0f5ff; }
        .int-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .int-badge-blue   { background: #dbeafe; color: #1d4ed8; }
        .int-badge-grey   { background: #f1f5f9; color: #64748b; }
        .int-badge-green  { background: #dcfce7; color: #166534; }
        .int-badge-yellow { background: #fef9c3; color: #854d0e; }

        /* ── form styles ── */
        .int-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }
        .int-form-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--col-muted);
            margin-bottom: 6px;
        }
        .int-form-field input,
        .int-form-field select,
        .int-form-field textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--col-border);
            border-radius: 4px;
            font-size: 13px;
            background: var(--col-surface);
            color: var(--col-text);
            box-sizing: border-box;
        }
        .int-form-field textarea { resize: vertical; min-height: 72px; }
        .int-form-field.span-2  { grid-column: span 2; }
        .int-form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }


        .int-msg { margin-top: 10px; font-size: 13px; min-height: 20px; }
        .int-msg.ok  { color: var(--col-success); }
        .int-msg.err { color: var(--col-danger); }

        .employee-header-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .init-section-title  { font-size:16px; font-weight:700; color:var(--col-text); }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <main class="hero">

            <!-- ===== PANEL: INITIATE ===== -->
            <div id="panelInitiate" style="display:none;">
                <div class="form-card" style="padding:24px;">
                    <div class="employee-header-bar">
                        <div class="init-section-title">Initiate Internal Model Review</div>
                    </div>

                    <div class="int-form-grid">
                        <div class="int-form-field span-2">
                            <label>Copy from an external review <span style="font-weight:400;opacity:.7;">(optional — or choose Job / Unit / Stage below)</span></label>
                            <select id="initExternalReviewPicker">
                                <option value="">— Loading external reviews… —</option>
                            </select>
                        </div>
                        <div class="int-form-field">
                            <label>Job No * <span style="font-weight:400;opacity:.7;">(PIMS jobs where you are GL / LE)</span></label>
                            <select id="initJobNo"><option value="">— Loading jobs… —</option></select>
                        </div>
                        <div class="int-form-field">
                            <label>Master Unit *</label>
                            <select id="initUnitNo" disabled><option value="">— Select Job first —</option></select>
                            <div id="initUnitGroup" style="font-size:11.5px;opacity:.75;margin-top:4px;"></div>
                        </div>
                        <div class="int-form-field">
                            <label>Stage *</label>
                            <select id="initStage"><option value="">— Select Stage —</option></select>
                        </div>
                        <div class="int-form-field">
                            <label>From Date</label>
                            <input type="date" id="initFromDate" />
                        </div>
                        <div class="int-form-field">
                            <label>To Date</label>
                            <input type="date" id="initToDate" />
                        </div>
                        <div class="int-form-field span-2">
                            <label>Description (optional)</label>
                            <textarea id="initDesc" placeholder="Brief description of this internal review…"></textarea>
                        </div>
                    </div>

                    <div class="int-form-actions" id="initFormActions">
                        <button class="mrcs-btn" id="initiateBtn">&#10010; Create Internal Review</button>
                    </div>
                    <div class="int-msg" id="initiateMsg"></div>
                </div>

                <!-- Table of existing internal reviews -->
                <div class="form-card" style="padding:24px; margin-top:20px;">
                    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--col-muted);margin-bottom:14px;">
                        Existing Internal Reviews
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="int-review-list" id="initiatedTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Job No</th>
                                    <th>Unit No</th>
                                    <th>Stage</th>
                                    <th>Description</th>
                                    <th>From Date</th>
                                    <th>To Date</th>
                                    <th>Assigned</th>
                                    <th>Initiated</th>
                                </tr>
                            </thead>
                            <tbody id="initiatedBody">
                                <tr><td colspan="7" style="text-align:center;color:var(--col-muted);padding:24px;">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Team moved to Administration → Team (internal-admin.html#team) -->
                <div class="form-card" style="padding:16px 24px; margin-top:20px; font-size:13px;">
                    Assign your department's <b>LE / JE</b> to an internal review in
                    <a href="internal-admin.html#team" style="font-weight:600;">Administration &rarr; Team</a>.
                </div>
            </div>


        </main>

        <footer class="footer" style="padding:12px 28px;font-size:12px;display:flex;justify-content:space-between;">
            <div><a href="#">EIL</a> &nbsp;•&nbsp; <a href="#">MRCS</a></div>
            <div>Internal Operations Mode</div>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/internal-navbar.js"></script>
    <script src="js/header.js"></script>

    <script>
    /* ── Department GL/LE guard ── */
    (function () {
        var role = localStorage.getItem('role') || '';
        if (!['LE','GL'].includes(role)) {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:#64748b;">Access restricted — GL / LE only.</div>';
        }
    })();

    /* ── Panel routing ── */
    function showPanel(hash) {
        document.getElementById('panelInitiate').style.display = '';
    }


    /* ── Helpers ── */
    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtDate(d) {
        if (!d) return '—';
        return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    }
    function setMsg(id, text, isErr) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.className = 'int-msg ' + (isErr ? 'err' : 'ok');
    }

    /* ══════════════════════════════════════════════
       PANEL: INITIATE
    ══════════════════════════════════════════════ */
    // Internal reviews no longer need a PEM external review: pick Job / Master Unit /
    // Stage directly (PIMS, live — only where you are GL / LE for your department).
    // Picking an external review is an optional shortcut that fills those in.
    var selectedExternalReviewId = null;
    var initMasterUnits = [];

    async function loadInitJobs() {
        var sel = document.getElementById('initJobNo');
        try {
            var data = await apiFetch('/api/pims/jobs?lead=1');
            var jobs = data.jobs || [];
            sel.innerHTML = jobs.length
                ? '<option value="">— Select Job —</option>' + jobs.map(function (j) {
                    return '<option value="' + esc(j.job_no) + '">' + esc(j.job_no) + ' — ' + esc(j.job_name) + '</option>';
                  }).join('')
                : '<option value="">— You are not GL / LE on any PIMS job —</option>';
        } catch (e) {
            sel.innerHTML = '<option value="">— Could not load jobs from PIMS —</option>';
        }
    }

    async function loadInitUnits(jobNo, selectUnit) {
        var sel = document.getElementById('initUnitNo');
        document.getElementById('initUnitGroup').textContent = '';
        initMasterUnits = [];
        if (!jobNo) { sel.innerHTML = '<option value="">— Select Job first —</option>'; sel.disabled = true; return; }
        sel.innerHTML = '<option value="">— Loading units… —</option>';
        try {
            var data = await apiFetch('/api/pims/master-units?lead=1&jobNo=' + encodeURIComponent(jobNo));
            initMasterUnits = data.units || [];
            sel.innerHTML = initMasterUnits.length
                ? '<option value="">— Select Master Unit —</option>' + initMasterUnits.map(function (u) {
                    var extra = u.children.length ? ' (+' + u.children.length + ' units)' : '';
                    return '<option value="' + esc(u.unit_no) + '">' + esc(u.unit_no) + (u.unit_name ? ' — ' + esc(u.unit_name) : '') + extra + '</option>';
                  }).join('')
                : '<option value="">— No master units where you are GL / LE —</option>';
            sel.disabled = !initMasterUnits.length;
            if (selectUnit) { sel.value = selectUnit; showInitUnitGroup(selectUnit); }
        } catch (e) {
            sel.innerHTML = '<option value="">— Could not load units from PIMS —</option>';
        }
    }

    function showInitUnitGroup(unitNo) {
        var m = initMasterUnits.find(function (u) { return u.unit_no === unitNo; });
        document.getElementById('initUnitGroup').textContent = !m ? ''
            : m.children.length ? 'Covers ' + m.unit_no + ' + ' + m.children.map(function (c) { return c.unit_no; }).join(', ')
            : 'Standalone unit';
    }

    async function loadInitStages() {
        try {
            var data = await apiFetch('/api/pims/stages');
            document.getElementById('initStage').innerHTML = '<option value="">— Select Stage —</option>'
                + (data.stages || []).map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');
        } catch (e) { /* leave empty — server validates */ }
    }

    // Choosing Job / Unit / Stage by hand means "create directly" — drop the external shortcut
    function clearExternalShortcut() {
        selectedExternalReviewId = null;
        document.getElementById('initExternalReviewPicker').value = '';
    }
    document.getElementById('initJobNo').addEventListener('change', function () { clearExternalShortcut(); loadInitUnits(this.value); });
    document.getElementById('initUnitNo').addEventListener('change', function () { clearExternalShortcut(); showInitUnitGroup(this.value); });
    document.getElementById('initStage').addEventListener('change', clearExternalShortcut);

    async function loadExternalAssignedReviews() {
        var picker = document.getElementById('initExternalReviewPicker');
        try {
            var data = await apiFetch('/api/internal/external-assigned-reviews');
            var reviews = data.reviews || [];
            if (!reviews.length) {
                picker.innerHTML = '<option value="">— No external reviews to copy from —</option>';
                return;
            }
            picker.innerHTML = '<option value="">— None (choose Job / Unit / Stage below) —</option>'
                + reviews.map(function (r) {
                    var label = esc(r.job_no) + ' / ' + esc(r.unit_no) + ' / ' + esc(r.stage);
                    if (r.has_internal) label += '  ✓ (internal review already created)';
                    return '<option value="' + r.id + '"'
                        + ' data-job="' + esc(r.job_no) + '"'
                        + ' data-unit="' + esc(r.unit_no) + '"'
                        + ' data-stage="' + esc(r.stage) + '"'
                        + ' data-has-internal="' + r.has_internal + '">'
                        + label + '</option>';
                }).join('');
        } catch (e) {
            picker.innerHTML = '<option value="">— Failed to load reviews —</option>';
        }
    }

    document.getElementById('initExternalReviewPicker').addEventListener('change', async function () {
        var opt = this.options[this.selectedIndex];
        setMsg('initiateMsg', '', false);
        if (!this.value) { selectedExternalReviewId = null; return; }
        var id = this.value;
        // Fill Job / Unit / Stage from the external review (the job may not be in your lead list)
        var jobSel = document.getElementById('initJobNo');
        if (![].some.call(jobSel.options, function (o) { return o.value === opt.dataset.job; })) {
            jobSel.insertAdjacentHTML('beforeend', '<option value="' + esc(opt.dataset.job) + '">' + esc(opt.dataset.job) + '</option>');
        }
        jobSel.value = opt.dataset.job || '';
        await loadInitUnits(opt.dataset.job, opt.dataset.unit);
        document.getElementById('initStage').value = opt.dataset.stage || '';
        selectedExternalReviewId = id;   // set last — the fills above would clear it
        this.value = id;
    });

    async function loadInitiated() {
        try {
            var data = await apiFetch('/api/internal/initiated');
            var rows = data.reviews || [];
            var tbody = document.getElementById('initiatedBody');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--col-muted);padding:24px;">No internal reviews created yet.</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(function (r, i) {
                return '<tr>'
                    + '<td>' + (i + 1) + '</td>'
                    + '<td>' + esc(r.job_no) + '</td>'
                    + '<td>' + esc(r.unit_no) + '</td>'
                    + '<td><span class="int-badge int-badge-blue">' + esc(r.stage) + '</span></td>'
                    + '<td>' + esc(r.description || '—') + '</td>'
                    + '<td>' + fmtDate(r.review_date_from) + '</td>'
                    + '<td>' + fmtDate(r.review_date_to) + '</td>'
                    + '<td><span class="int-badge int-badge-grey">' + (r.assigned_count || 0) + ' users</span></td>'
                    + '<td>' + fmtDate(r.created_at) + '</td>'
                    + '</tr>';
            }).join('');
        } catch (e) {
            document.getElementById('initiatedBody').innerHTML =
                '<tr><td colspan="9" style="color:var(--col-danger);padding:16px;">Failed to load reviews.</td></tr>';
        }
    }

    document.getElementById('initiateBtn').addEventListener('click', async function () {
        var jobNo    = document.getElementById('initJobNo').value;
        var unitNo   = document.getElementById('initUnitNo').value;
        var stage    = document.getElementById('initStage').value;
        var fromDate = document.getElementById('initFromDate').value;
        var toDate   = document.getElementById('initToDate').value;
        var desc     = document.getElementById('initDesc').value.trim();
        setMsg('initiateMsg', '', false);

        if (!selectedExternalReviewId && (!jobNo || !unitNo || !stage)) {
            setMsg('initiateMsg', 'Please select Job, Master Unit and Stage.', true);
            return;
        }
        var body = selectedExternalReviewId
            ? { externalReviewId: selectedExternalReviewId }
            : { jobNo: jobNo, unitNo: unitNo, stage: stage };
        body.fromDate = fromDate || null;
        body.toDate = toDate || null;
        body.description = desc;

        try {
            await apiFetch('/api/internal/initiate', { method: 'POST', body: JSON.stringify(body) });
            setMsg('initiateMsg', 'Internal review created successfully.', false);
            clearExternalShortcut();
            document.getElementById('initJobNo').value = '';
            loadInitUnits('');
            document.getElementById('initStage').value = '';
            document.getElementById('initFromDate').value = '';
            document.getElementById('initToDate').value   = '';
            document.getElementById('initDesc').value     = '';
            loadExternalAssignedReviews();
            loadInitiated();
        } catch (e) {
            setMsg('initiateMsg', e.message || 'Failed to create internal review.', true);
        }
    });


    /* ── Boot ── */
    document.addEventListener('DOMContentLoaded', function () {
        showPanel();
        loadInitJobs();
        loadInitStages();
        loadExternalAssignedReviews();
        loadInitiated();
    });
    </script>
</body>
</html>
